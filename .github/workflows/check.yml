name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          for script in $(git ls-files '*.sh'); do
            echo "bash -n $script"
            bash -n "$script"
          done

      - name: shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: the Caddy build
        run: |
          image=$(ci/caddy-image.sh)
          [ -n "$image" ] || image=$(sed -n 's/^ *image: *\(europe-docker.pkg.dev\/selan-prod\/selan-public\/caddy@.*\)$/\1/p' compose.yaml)
          echo "CADDY=$image" >>"$GITHUB_ENV"
          echo "SELAN_CADDY_IMAGE=$image" >>"$GITHUB_ENV"

      - name: compose config, with OpenBao, with your own Vault, and with DNS-01
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile openbao config --quiet
          docker compose --env-file .env.example --profile openbao config --services | sort | tr '\n' ' ' | grep -qx 'caddy gateway keys openbao postgres proxy '
          export SELAN_TLS=dns SELAN_DNS_PROVIDER=hetzner SELAN_DNS_TOKEN=ci-not-a-token
          dns=(docker compose --env-file .env.example -f compose.yaml -f compose.dns.yaml)
          "${dns[@]}" config --quiet
          "${dns[@]}" config --format json | jq -e '.services.caddy.networks | has("egress")' >/dev/null
          docker compose --env-file .env.example config --format json | jq -e '.services.caddy.networks | has("egress") | not' >/dev/null
          # Only selan-keys has a vault identity, and only it shares a network with the vault.
          base=$(docker compose --env-file .env.example --profile openbao config --format json)
          jq -e '[.services[] | select(.networks | has("vault"))] | length == 2' <<<"$base" >/dev/null
          jq -e '.services.keys.networks | has("vault")' <<<"$base" >/dev/null
          jq -e '[.services.proxy, .services.gateway, .services.caddy, .services.postgres | .environment | keys[] | select(startswith("VAULT_"))] | length == 0' <<<"$base" >/dev/null
          # Only the gateway shares a network with its database.
          jq -e '[.services[] | select(.networks | has("gateway-db"))] | length == 2' <<<"$base" >/dev/null

      - name: Caddyfile, every TLS mode and every DNS provider install.sh offers
        run: |
          adapt() {
            docker run --rm -e SELAN_PROXY_HOST=gw.example.com -e SELAN_GATEWAY_HOST=mcp.example.com -e SELAN_KEYS_HOST=keys.example.com \
              -e ALLOWED_CIDRS=private_ranges -e SELAN_DNS_TOKEN=ci-secret-token "$@" \
              -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$CADDY" caddy adapt --config /etc/caddy/Caddyfile
          }
          adapt -e SELAN_TLS=internal >/dev/null
          adapt -e SELAN_TLS=files >/dev/null
          modules=$(docker run --rm "$CADDY" caddy list-modules)
          read -ra providers < <(sed -n 's/^DNS_PROVIDERS="\(.*\)"$/\1/p' install.sh)
          [ "${#providers[@]}" -gt 0 ]
          for provider in "${providers[@]}"; do
            grep -qx "dns.providers.$provider" <<<"$modules" || { echo "$CADDY has no dns.providers.$provider" >&2; exit 1; }
            config=$(adapt -e SELAN_TLS=dns -e SELAN_DNS_PROVIDER="$provider")
            ! grep -q ci-secret-token <<<"$config" || { echo "the DNS token is written into Caddy's config" >&2; exit 1; }
            echo "dns.providers.$provider: ok"
          done

      - name: every image pinned by digest, and every digest real
        run: ci/check-pins.sh

  # Each case on a fresh host with its own Docker daemon (ci/dind-test.sh); README, "Tests", lists them.
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [openbao, own-vault, dns, own-ca, tokens, outside, refusals, systemd, no-debian]
    steps:
      - uses: actions/checkout@v4

      - name: ${{ matrix.case }}
        run: bash ci/dind-test.sh "${{ matrix.case }}"

      - name: the paths install.sh took
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paths-${{ matrix.case }}
          path: ci-out/paths-${{ matrix.case }}.txt
          if-no-files-found: error

      - name: logs
        if: failure()
        run: |
          docker exec "selan-ci-${{ matrix.case }}" bash -c 'tail -n 40 /var/log/docker.log 2>/dev/null; cd /opt/selan &&
            export PROXY_KEYS_TOKEN=unused GATEWAY_KEYS_TOKEN=unused GATEWAY_DB_PASSWORD=unused COMPOSE_FILE="$PWD/compose.yaml:$PWD/ci/compose.ci.yaml" &&
            docker compose --project-directory "$PWD" --profile openbao logs --tail 80' || true

  # Every path of install.sh taken by some case: every command line ran, and every `fail` ran as one.
  paths:
    needs: case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: paths-*
          path: ci-out
          merge-multiple: true

      - name: path coverage of install.sh
        run: python3 -I ci/paths.py ci-out/paths-*.txt
