# CI only: compose.yaml with stand-ins for the proxy and gateway and a fake control on `egress`.
# Run with SELAN_PROXY_IMAGE and SELAN_GATEWAY_IMAGE set to the python image below.
services:
  proxy:
    command: ["python", "/ci/stand_in.py"]
    environment:
      STAND_IN_COMPONENT: proxy
    volumes:
      - ./ci:/ci:ro

  gateway:
    command: ["python", "/ci/stand_in.py"]
    environment:
      STAND_IN_COMPONENT: gateway
    volumes:
      - ./ci:/ci:ro

  fake-control:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    command: ["python", "/ci/fake_control.py"]
    environment:
      EXPECTED_TOKEN: selanreg_ci-stack-test
    volumes:
      - ./ci:/ci:ro
    networks: [egress]
