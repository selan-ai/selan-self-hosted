# Selan's proxy, MCP gateway and selan-keys on a company's own server, with its vault.
# install.sh writes .env beside this file; README.md says what each part does.
name: selan

services:
  proxy:
    image: europe-docker.pkg.dev/selan-prod/selan-public/selan-proxy:0.1.0@sha256:1119c47af44f904bb6d559acca559e793dbfb916d489310d8513b40bfc1a6534
    restart: unless-stopped
    environment:
      PROXY_MODE: self-hosted
      PORT: "8080"
      PUBLIC_BASE_URL: https://${SELAN_PROXY_HOST:?}
      CONTROL_BASE_URL: ${CONTROL_BASE_URL:-https://control.selan.ai}
      SELAN_IDENTITY_DIR: /var/lib/selan-proxy
      # Passed only while install.sh has it: the proxy refuses a blank one, and .env drops it once registered.
      SELAN_REGISTRATION_TOKEN:
      # No vault address or vault identity: every key goes through selan-keys, with this caller's own token.
      SELAN_KEYS_URL: http://keys:8080
      SELAN_KEYS_TOKEN: ${PROXY_KEYS_TOKEN:?}
      # No ALLOWED_CIDRS here: the proxy publishes no port, and Caddy refuses a client outside them first.
      # The company's own allowlist for launch settings: what control sends beyond it never reaches a developer.
      # Passed only when set, from .env: the proxy refuses a blank one.
      LAUNCH_CONNECTORS:
      LAUNCH_MARKETPLACES:
      LAUNCH_SETTINGS_DEFAULTS:
    volumes:
      - proxy-identity:/var/lib/selan-proxy
    networks: [inside, egress]

  # The gateway also reads every variable of Selan's own (its README, "Self-hosted mode"): those its connectors
  # on Google Cloud need are not mounted here, so they get fixed stand-ins. GitLab, GitHub and Slack sign-ins
  # need OAuth apps of the company's own, which this release does not configure.
  gateway:
    image: europe-docker.pkg.dev/selan-prod/selan-public/selan-mcp-gateway:0.1.1@sha256:5bc0a962e5ac93db26d0ef240cce510b30c0822ba96f85594634661def04a018
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GATEWAY_MODE: self-hosted
      PORT: "8080"
      PUBLIC_BASE_URL: https://${SELAN_GATEWAY_HOST:?}
      CONTROL_BASE_URL: ${CONTROL_BASE_URL:-https://control.selan.ai}
      AUTH_SERVER_URL: ${AUTH_BASE_URL:-https://auth.selan.ai}
      REACTOR_URL: https://reactor.selan.ai
      # The image's distroless home, owned by its user: a new volume there is writable by it.
      SELAN_IDENTITY_DIR: /home/nonroot
      SELAN_REGISTRATION_TOKEN:
      SELAN_KEYS_URL: http://keys:8080
      SELAN_KEYS_TOKEN: ${GATEWAY_KEYS_TOKEN:?}
      GATEWAY_DATABASE_URL: postgresql://gateway:${GATEWAY_DB_PASSWORD:?}@postgres:5432/gateway?sslmode=disable
      MCP_KNOWN_CLIENT_REDIRECTS: https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback
      # Read, and unused on an own server: nothing is sealed with it, and Caddy strips X-Selan-Edge.
      GATEWAY_ENCRYPTION_KEY: unused-on-an-own-server
      EDGE_SECRET: unused-on-an-own-server
      FIREBASE_MCP_URL: https://unused.invalid
      ADMIN_SA_EMAIL: unused@unused.invalid
      GITLAB_CLIENT_ID: not-configured
      GITLAB_CLIENT_SECRET: not-configured
      GITHUB_CLIENT_ID: not-configured
      GITHUB_CLIENT_SECRET: not-configured
      SLACK_CLIENT_ID: not-configured
      SLACK_CLIENT_SECRET: not-configured
    volumes:
      - gateway-identity:/home/nonroot
    networks: [inside, egress, gateway-db]

  # The gateway's own database: its sign-ins' rows (each secret itself is kept at selan-keys). Reached by the
  # gateway alone, on a network with no route out. Postgres publishes no signature; it is pinned by digest.
  postgres:
    image: docker.io/library/postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:?}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "gateway", "-d", "gateway"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - gateway-db:/var/lib/postgresql
    networks: [gateway-db]

  # selan-keys: the one component that holds a vault identity, an AppRole that reads and writes under
  # VAULT_PREFIX. The proxy and the gateway ask it with their own token; the admin's browser reaches it at
  # keys.<domain> through Caddy. It registers with control with a registration token of its own.
  keys:
    image: europe-docker.pkg.dev/selan-prod/selan-public/selan-keys:0.1.2@sha256:aed899521c83c0072673cb8d17ebba7898c408e01da20ac98371f4c75426e572
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Selan's screen in the admin's browser (control.selan.ai, its only CORS origin) calls this one, via Caddy.
      ADMIN_PORT: "8081"
      PUBLIC_BASE_URL: https://${SELAN_KEYS_HOST:?}
      CONTROL_BASE_URL: ${CONTROL_BASE_URL:-https://control.selan.ai}
      SELAN_IDENTITY_DIR: /var/lib/selan-keys
      SELAN_REGISTRATION_TOKEN: ${SELAN_KEYS_REGISTRATION_TOKEN:-}
      VAULT_ADDR: ${VAULT_ADDR:-http://openbao:8200}
      VAULT_PREFIX: ${VAULT_PREFIX:-kv/selan/}
      VAULT_ROLE_ID: ${KEYS_VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${KEYS_VAULT_SECRET_ID:-}
      # The callers it answers, each by its own token.
      KEYS_PROXY_TOKEN: ${PROXY_KEYS_TOKEN:?}
      KEYS_GATEWAY_TOKEN: ${GATEWAY_KEYS_TOKEN:?}
    volumes:
      - keys-identity:/var/lib/selan-keys
    networks: [vault, inside, egress]

  # Only where the company has no Vault of its own: install.sh sets COMPOSE_PROFILES=openbao
  # when VAULT_ADDR is unset. No ports and no route out; only selan-keys shares its network.
  openbao:
    profiles: [openbao]
    image: quay.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    restart: unless-stopped
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/file
    networks: [vault]

  # Unseals OpenBao whenever it answers sealed, so a crash, a restart or an upgrade does not leave the company
  # down until somebody unseals it. Root in its own container only to read the root-only key file; no route out.
  unseal:
    profiles: [openbao]
    image: quay.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    restart: unless-stopped
    user: "0"
    entrypoint: ["/bin/sh", "/unseal-watch.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./unseal-watch.sh:/unseal-watch.sh:ro
      - ./openbao-unseal.key:/run/selan/openbao-unseal.key:ro
    depends_on: [openbao]
    networks: [vault]

  # TLS on the VPN address. `front` publishes the port but has no NAT, so Caddy cannot reach out, except
  # with SELAN_TLS=dns, where compose.dns.yaml adds `egress` for Let's Encrypt and the DNS provider's API.
  # Caddy built with the DNS provider modules (caddy/Dockerfile), signed by this repository's CI.
  caddy:
    image: europe-docker.pkg.dev/selan-prod/selan-public/caddy@sha256:730fda830eeca43af92111b5c023def2dc73f2fb084f54667c725146726b4b97
    restart: unless-stopped
    environment:
      SELAN_PROXY_HOST: ${SELAN_PROXY_HOST:?}
      SELAN_GATEWAY_HOST: ${SELAN_GATEWAY_HOST:?}
      SELAN_KEYS_HOST: ${SELAN_KEYS_HOST:?}
      SELAN_TLS: ${SELAN_TLS:?}
      ALLOWED_CIDRS: ${ALLOWED_CIDRS:-private_ranges}
    ports:
      - ${SELAN_BIND_ADDR:?}:443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
    networks: [inside, front]

networks:
  # The vault's whole world, shared with selan-keys alone. No route out, and no address on the host.
  vault:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  # Caddy, the proxy, the gateway and selan-keys. No route out, and no address on the host.
  inside:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  # The gateway and its Postgres alone. No route out, and no address on the host.
  gateway-db:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  # The way out to Selan, the providers and a company's own Vault: the proxy, the gateway and selan-keys.
  egress: {}
  front:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  proxy-identity:
  gateway-identity:
  gateway-db:
  keys-identity:
  openbao-data:
  caddy-data:
